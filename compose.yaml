services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawprints"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pawprints_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AUTH_DB_PASSWORD: test_auth
      EVENT_DB_PASSWORD: test_event
      MEDIA_DB_PASSWORD: test_media
      ANALYTICS_DB_PASSWORD: test_analytics
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawprints_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  event:
    build:
      context: .
      dockerfile: services/event/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      event:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - media_data:/var/lib/pawprints/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      EVENT_INTERNAL_TOKEN: ${EVENT_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
      media:
        condition: service_healthy
      analytics:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/auth/alembic.ini", "upgrade", "head"]

  event-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/event/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/event/alembic.ini", "upgrade", "head"]

  media-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/media/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - media_data:/var/lib/pawprints/media
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/media/alembic.ini", "upgrade", "head"]

  smoke:
    profiles: ["jobs"]
    image: python:3.12-slim
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PAWPRINTS_BASE_URL: http://nginx
    volumes:
      - ./tests/smoke:/smoke:ro
    working_dir: /smoke
    command: ["python", "pawprints_smoke.py"]

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  media_data:
