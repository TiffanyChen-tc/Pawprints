services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawprints"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pawprints_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AUTH_DB_PASSWORD: test_auth
      EVENT_DB_PASSWORD: test_event
      MEDIA_DB_PASSWORD: test_media
      ANALYTICS_DB_PASSWORD: test_analytics
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawprints_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  event:
    build:
      context: .
      dockerfile: services/event/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      event:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - media_data:/var/lib/pawprints/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      EVENT_INTERNAL_TOKEN: ${EVENT_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
      media:
        condition: service_healthy
      analytics:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.7.3
    depends_on:
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
      media:
        condition: service_healthy
      analytics:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: pawprints-dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/auth/alembic.ini", "upgrade", "head"]

  event-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/event/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/event/alembic.ini", "upgrade", "head"]

  media-migrate:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: services/media/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - media_data:/var/lib/pawprints/media
    working_dir: /repo
    command: ["python", "-m", "alembic", "-c", "services/media/alembic.ini", "upgrade", "head"]

  smoke:
    profiles: ["jobs"]
    image: python:3.12-slim
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PAWPRINTS_BASE_URL: http://nginx
    volumes:
      - ./tests/smoke:/smoke:ro
    working_dir: /smoke
    command: ["python", "pawprints_smoke.py"]

  seed:
    profiles: ["jobs"]
    image: python:3.12-slim
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PAWPRINTS_BASE_URL: http://nginx
      PAWPRINTS_DEMO_EMAIL: ${PAWPRINTS_DEMO_EMAIL:-demo@pawprints.local}
      PAWPRINTS_DEMO_PASSWORD: ${PAWPRINTS_DEMO_PASSWORD:-demo123}
      PAWPRINTS_DEMO_DISPLAY_NAME: ${PAWPRINTS_DEMO_DISPLAY_NAME:-Pawprints Demo}
      PAWPRINTS_DEMO_ANCHOR_DATE: ${PAWPRINTS_DEMO_ANCHOR_DATE:-2026-09-13}
    volumes:
      - ./demo:/demo:ro
    working_dir: /demo
    command: ["python", "seed.py"]

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  media_data:
